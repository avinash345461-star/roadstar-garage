      <stop offset="0%" stop-color="#FFDC4A" />
      <stop offset="50%" stop-color="#F5C400" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
